<body data-theme="ivory" data-font="gothic">

  <div id="prog" aria-hidden="true"></div>
  <div id="running" aria-hidden="true"></div>

  <!-- 초기 화면 -->
  <section id="home" class="view active" aria-label="초기 화면">
    <header class="home-top">
      <span class="wordmark">서가</span>
      <span id="home-count"></span>
    </header>

    <button class="hero-book" id="home-resume" hidden>
      <span class="hero-cover" id="resume-cover"></span>
      <span class="hero-text">
        <span class="resume-meta" id="resume-meta"></span>
        <span class="hero-cta">이어서 읽기</span>
      </span>
    </button>

    <div class="home-empty" id="home-empty" hidden>
      <h1 class="home-title">첫 책을<br>올려 볼까요</h1>
      <p class="lede">텍스트를 붙여넣거나 파일을 열면,<br>가장 최근에 읽은 책이 여기에 펼쳐져요.</p>
    </div>

    <nav class="home-actions" aria-label="시작하기">
      <button class="home-btn" id="home-library">
        <span class="home-ico" data-icon="books" aria-hidden="true"></span><span>서재</span>
      </button>
      <button class="home-btn" id="home-paste">
        <span class="home-ico" data-icon="paste" aria-hidden="true"></span><span>붙여넣기</span>
      </button>
      <button class="home-btn" id="home-open">
        <span class="home-ico" data-icon="folder" aria-hidden="true"></span><span>파일 열기</span>
      </button>
    </nav>
  </section>

  <!-- 서재 목록 -->
  <section id="library" class="view" aria-label="서재">
    <header class="top">
      <div class="top-l">
        <button class="ico" id="btn-home" data-icon="back" aria-label="처음 화면" title="처음 화면"></button>
        <h1 class="brand">서재</h1>
      </div>
      <div class="actions">
        <button class="ico" id="btn-paste" data-icon="paste" aria-label="텍스트 붙여넣기" title="텍스트 붙여넣기"></button>
        <button class="ico" id="btn-open-lib" data-icon="folder" aria-label="파일 열기" title="파일 열기"></button>
      </div>
    </header>
    <nav class="filters" id="filters" aria-label="필터">
      <button class="on" data-filter="all">전체</button>
      <button data-filter="reading">읽는 중</button>
      <button data-filter="done">완독</button>
    </nav>
    <main id="shelf"></main>
    <p class="hint">Safari 공유 버튼 › ‘홈 화면에 추가’로 앱처럼 설치할 수 있어요</p>
  </section>

  <!-- 읽기 -->
  <section id="reader" class="view" aria-label="읽기">
    <article id="page">
      <header id="book-head">
        <h1 id="book-title"></h1>
      </header>
      <div id="text"></div>
      <p class="end">· · ·</p>
    </article>
  </section>

  <!-- 자동숨김 아이콘 메뉴 -->
  <nav id="bar" class="hidden" aria-label="읽기 메뉴">
    <button class="ico" data-act="library" data-icon="back" aria-label="서재" title="서재"></button>
    <button class="ico" data-act="toc" data-icon="list" aria-label="목차" title="목차"></button>
    <button class="ico" data-act="open" data-icon="folder" aria-label="파일 열기" title="파일 열기"></button>
    <button class="ico" id="btn-bm" data-act="bm" data-icon="bookmark" aria-label="책갈피" title="책갈피"></button>
    <button class="ico" id="btn-tts" data-act="tts" data-icon="speaker" aria-label="음성 읽기" title="음성 읽기"></button>
    <button class="ico" data-act="settings" data-icon="sliders" aria-label="설정" title="설정"></button>
    <button class="ico" id="btn-night" data-act="night" data-icon="moon" aria-label="나이트 모드" title="나이트 모드"></button>
  </nav>

  <div id="scrim"></div>

  <!-- 목차 / 책갈피 패널 -->
  <aside id="toc" aria-label="목차와 책갈피">
    <div class="panel-head">
      <div class="seg" id="toc-tabs">
        <button class="on" data-tab="toc">목차</button>
        <button data-tab="bm">책갈피</button>
      </div>
      <button class="ico sm" data-close data-icon="close" aria-label="닫기" title="닫기"></button>
    </div>
    <p id="toc-note" class="note"></p>
    <div id="toc-list" class="list"></div>
    <div id="bm-list" class="list" hidden></div>
  </aside>

  <!-- 설정 시트 -->
  <section id="sheet" aria-label="읽기 설정">
    <div class="grip"></div>
    <div class="sheet-head">
      <h2>읽기 설정</h2>
      <button class="ico sm" data-close data-icon="close" aria-label="닫기" title="닫기"></button>
    </div>
    <div class="preview" aria-hidden="true">
      <p class="preview-text">달빛이 창가에 내려앉은 밤, 책장 넘기는 소리만 방 안을 채웠다.</p>
    </div>
    <div class="group">
      <div class="row">
        <span>글꼴</span>
        <div class="seg">
          <button data-set="font:gothic">고딕</button>
          <button data-set="font:myeongjo">명조</button>
        </div>
      </div>
      <div class="row">
        <span>글자 크기</span>
        <div class="ctl">
          <input id="s-size" type="range" min="14" max="28" step="1" aria-label="글자 크기">
          <output id="o-size" class="val"></output>
        </div>
      </div>
      <div class="row">
        <span>자간</span>
        <div class="ctl">
          <input id="s-ls" type="range" min="-0.02" max="0.12" step="0.01" aria-label="자간">
          <output id="o-ls" class="val"></output>
        </div>
      </div>
      <div class="row">
        <span>화면</span>
        <div class="seg">
          <button data-set="theme:light">흰 종이</button>
          <button data-set="theme:ivory">한지</button>
          <button data-set="theme:night">밤</button>
        </div>
      </div>
    </div>
    <div class="group">
      <div class="row">
        <span>읽어 줄 음성</span>
        <select id="s-voice" aria-label="음성 선택"></select>
      </div>
      <div class="row">
        <span>읽기 속도</span>
        <div class="ctl">
          <input id="s-rate" type="range" min="0.6" max="1.6" step="0.1" aria-label="읽기 속도">
          <output id="o-rate" class="val"></output>
        </div>
      </div>
    </div>
  </section>

  <!-- 텍스트 붙여넣기 -->
  <div id="modal" class="modal" hidden>
    <div class="card" role="dialog" aria-label="텍스트 붙여넣기">
      <h2>텍스트 붙여넣기</h2>
      <input id="paste-title" placeholder="제목 (비우면 첫 줄을 써요)" maxlength="60">
      <textarea id="paste-text" placeholder="본문을 붙여넣어 주세요"></textarea>
      <div class="end-row">
        <button class="txt" id="paste-cancel">취소</button>
        <button class="txt strong" id="paste-ok">서재에 추가</button>
      </div>
    </div>
  </div>

  <div id="busy" hidden><div class="spin"></div><p id="busy-msg"></p></div>
  <div id="toast" role="status"></div>

  <input id="file" class="sr" type="file" accept=".txt,.md,.markdown,.html,.htm,.docx,.pdf,.epub">

  <script src="app.js" defer></script>
</body>
</html>
